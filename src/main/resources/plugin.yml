name: DominionMobClear
version: '1.4.5'
main: net.starryisle.dominionmobclear.DominionMobClearPlugin
api-version: '1.20'
description: Clears hostile mobs that are inside a Dominion claim
author: StarryIsle
depend: [Dominion]
commands:
  dmc:
    description: DominionMobClear admin command
    usage: /dmc <toggle|status|clear|reload>
permissions:
  dominionmobclear.admin:
    description: Use /dmc clear and /dmc reload, and toggle any claim
    default: op
